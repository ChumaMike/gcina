name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: policy, run: "pnpm typecheck && pnpm test" }
          - { dir: agent, run: "pnpm typecheck" }
          - { dir: ledger, run: "pnpm typecheck" }
          - { dir: web, run: "npx next typegen && npx tsc --noEmit && npx eslint src" }
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.run }}
